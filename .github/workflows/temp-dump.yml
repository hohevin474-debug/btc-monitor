name: temp-dump
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-dump.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: dump V2 全量明细(对照推送)
        run: |
          URL="https://btc-monitor.hohevin474.workers.dev/api/backtest?limit=500"
          for i in 1 2 3; do
            curl -s -m 30 "$URL" -o /tmp/bt.json -w "HTTP %{http_code}\n" && break
            sleep 3
          done
          node -e '
          const d=JSON.parse(require("fs").readFileSync("/tmp/bt.json","utf8"));
          const r=d.recent||[];
          // 只取 V2（推送过的真实系统）
          const v2=r.filter(x=>x.strategy==="v2").sort((a,b)=>a.time-b.time);
          console.log("抓取时刻(UTC):", new Date().toISOString());
          console.log("V2 原始记录总条数(含细粒度重复):", v2.length);
          console.log("");
          console.log("=== V2 全部原始记录(按时间) ===");
          v2.forEach((x,i)=>{
            const tm=new Date((x.time||0)*1000).toISOString().replace("T"," ").slice(0,16);
            const p1=x.pnl_h1, p6=x.pnl_h6, p24=x.pnl_h24;
            console.log(`${String(i).padStart(2)}. ${tm}Z | ${x.direction} | $${Math.round(x.price)} | prob=${(x.prob*100).toFixed(0)}% | h1=${p1} h6=${p6} h24=${p24} | done=${x.done}`);
          });
          // 6h 去重(与线上 dedupeSegments 一致)
          console.log("");
          console.log("=== 6h 去重后(线上 pnl 统计口径) ===");
          let last=null, seg=0;
          v2.forEach(x=>{
            if(last===null || x.time-last>=6*3600){ seg++; last=x.time;
              const tm=new Date(x.time*1000).toISOString().replace("T"," ").slice(0,16);
              console.log(`${String(seg).padStart(2)}. ${tm}Z | ${x.direction} | $${Math.round(x.price)} | prob=${(x.prob*100).toFixed(0)}% | h24=${x.pnl_h24} | done=${x.done}`);
            }
          });
          '
