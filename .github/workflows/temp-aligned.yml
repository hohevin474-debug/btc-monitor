name: temp-aligned
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-aligned.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 抓取对齐后战绩
        run: |
          URL="https://btc-monitor.hohevin474.workers.dev/api/backtest?limit=500"
          for i in 1 2 3; do
            curl -s -m 30 "$URL" -o /tmp/bt.json -w "HTTP %{http_code}\n" && break
            sleep 3
          done
          node -e '
          const d=JSON.parse(require("fs").readFileSync("/tmp/bt.json","utf8"));
          console.log("抓取时刻(UTC):", new Date().toISOString());
          console.log("activeStrategy:", d.activeStrategy);
          console.log("");
          console.log("=== pnl (对齐推送 realized) ===");
          console.log(JSON.stringify(d.pnl));
          console.log("=== pnlH24 (旧口径参考) ===");
          console.log(JSON.stringify(d.pnlH24));
          const v2=(d.recent||[]).filter(x=>x.strategy==="v2").sort((a,b)=>a.time-b.time);
          console.log("");
          console.log("=== V2 全部记录(含 aligned realized 对照) ===");
          v2.forEach((x,i)=>{
            const tm=new Date((x.time||0)*1000).toISOString().replace("T"," ").slice(0,16);
            const real = x.realized===null? "—" : (x.realized>=0?"+":"")+x.realized+(x.realizedKind?"("+x.realizedKind+")":"");
            console.log(`${String(i).padStart(2)}. ${tm}Z | ${x.direction} | $${Math.round(x.price)} | h24=${x.h24} | realized=${real} | done=${x.done}`);
          });
          const withReal=v2.filter(x=>x.realized!==null).length;
          console.log("");
          console.log("V2 记录总数:", v2.length, "| 已写回 realized 的:", withReal);
          '
