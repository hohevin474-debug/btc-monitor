name: temp-bark-hist
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-bark-hist.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 探测 day.app 历史接口
        run: |
          KEY="jNVNkxWwVd88vNYoq7RxMa"
          for path in "" "/history" "/history?page=1" "/api/history?token=$KEY" "/api/history?token=$KEY&page=1"; do
            echo "=== GET https://api.day.app/$KEY$path ==="
            curl -s -m 20 "https://api.day.app/$KEY$path" -w "\n[HTTP %{http_code}]\n" | head -c 600
            echo ""
          done
