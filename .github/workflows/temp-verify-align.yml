name: temp-verify-align
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-verify-align.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 验证战绩对齐推送字段
        run: |
          URL="https://btc-monitor.hohevin474.workers.dev/api/backtest?limit=500"
          for i in 1 2 3; do
            curl -s -m 30 "$URL" -o /tmp/bt.json -w "HTTP %{http_code}\n" && break
            sleep 3
          done
          node -e '
          const d=JSON.parse(require("fs").readFileSync("/tmp/bt.json","utf8"));
          console.log("activeStrategy:", d.activeStrategy);
          console.log("=== pnl (主战绩=推送对齐 realized) ===");
          console.log(JSON.stringify(d.pnl));
          console.log("=== pnlH24 (旧口径参考, 固定24H终点价) ===");
          console.log(JSON.stringify(d.pnlH24));
          console.log("=== recent 最新3条(含realized对照) ===");
          (d.recent||[]).slice(-3).forEach(x=>{
            const tm=new Date((x.time||0)*1000).toISOString().slice(0,16);
            console.log(`${tm} | ${x.strategy} ${x.direction} | $${Math.round(x.price)} | h24=${x.h24} | realized=${x.realized} (${x.realizedKind||"-"}) | done=${x.done}`);
          });
          const withReal=((d.recent||[]).filter(x=>x.realized!==null)).length;
          console.log("recent 中带 realized 的记录数:", withReal);
          '
