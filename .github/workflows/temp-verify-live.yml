name: temp-verify-live
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-verify-live.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: fetch online backtest & inspect new fields
        run: |
          set -e
          URL="https://btc-monitor.hohevin474.workers.dev/api/backtest?limit=8"
          curl -s "$URL" -o /tmp/bt.json
          echo "=== raw size ==="; wc -c /tmp/bt.json
          node -e '
            const fs=require("fs");
            const raw=fs.readFileSync("/tmp/bt.json","utf8");
            let top; try{ top=JSON.parse(raw); }catch(e){ console.log("PARSE_FAIL first200:", raw.slice(0,200)); process.exit(0); }
            console.log("=== top-level keys ===", Object.keys(top));
            const recs = top.records || top.data || top.trades || (Array.isArray(top)? top: null);
            if(!recs){ console.log("NO records array; sample top:", JSON.stringify(top).slice(0,400)); process.exit(0); }
            console.log("=== record count ===", recs.length);
            const last = recs[recs.length-1];
            console.log("=== last record keys ===", Object.keys(last));
            console.log("=== last record (pretty) ===");
            console.log(JSON.stringify(last, null, 1));
            // 关键：新代码是否写入 stopPct / stopped 字段？
            const hasStopPct = recs.some(r => r.stopPct !== undefined);
            const hasStopped = recs.some(r => r.stopped !== undefined);
            console.log("=== NEW-FIELDS-PRESENT stopPct:", hasStopPct, " stopped:", hasStopped, " ===");
            if(last.time) console.log("=== last record time(UTC) ===", new Date(last.time*1000).toISOString());
          '
