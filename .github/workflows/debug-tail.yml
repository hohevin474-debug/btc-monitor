name: Debug Tail

# 临时诊断：wrangler tail 抓 worker 实时异常（用完即删）
on:
  workflow_dispatch:

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Tail worker logs (100s)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          timeout 100 npx --yes wrangler@3 tail --format=json 2>&1 | head -100 || true
