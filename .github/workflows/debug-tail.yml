name: Debug Tail

# 临时诊断：wrangler tail 抓 worker 实时异常（用完即删）
on:
  workflow_dispatch:

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Tail worker logs (110s)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          timeout 110 npx --yes wrangler@3 tail --format=json > /tmp/tail.log 2>&1 || true
          echo "=== events: $(grep -c '"outcome"' /tmp/tail.log) ==="
          grep -c '"exceptions": \[\]' /tmp/tail.log || true
          echo "=== exceptions ==="
          grep -A 30 '"exceptions": \[$' /tmp/tail.log | head -80 || echo "no exceptions found"
