name: temp-check2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-check2.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 抓取线上回测接口(含pnlStop)
        run: |
          URL="https://btc-monitor.hohevin474.workers.dev/api/backtest?limit=500"
          for i in 1 2 3; do
            curl -s -m 30 "$URL" -o /tmp/bt.json -w "HTTP %{http_code}\n" && break
            sleep 3
          done
          node -e '
          const d=JSON.parse(require("fs").readFileSync("/tmp/bt.json","utf8"));
          console.log("activeStrategy:", d.activeStrategy);
          console.log("=== pnl (终点价口径, 旧) ===");
          console.log(JSON.stringify(d.pnl));
          console.log("=== pnlStop (止损口径, 新) ===");
          console.log(JSON.stringify(d.pnlStop));
          console.log("=== pnl6 (6H 终点价) ===");
          console.log(JSON.stringify(d.pnl6));
          console.log("=== pnl6Stop (6H 止损) ===");
          console.log(JSON.stringify(d.pnl6Stop));
          const r=d.recent||[];
          console.log("recent total:", r.length, "| last time:", new Date(Math.max(...r.map(x=>x.time))*1000).toISOString());
          const v2 = r.filter(x=>x.strategy==="v2");
          console.log("v2 recent count:", v2.length, "| v2 last:", v2.length? new Date(Math.max(...v2.map(x=>x.time))*1000).toISOString() : "none");
          '
